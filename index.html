<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTK 移植工作室</title>
    <style>
      /*
       * 启动占位：WebView 加载前端 bundle 期间先显示一个轻量骨架，
       * 避免白屏。React 挂载时会整体替换 #root 的内容。
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fbf9fa;
        color: #1b1b1d;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #131315;
          color: #e5e1e3;
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "MiSans", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei UI",
          "Microsoft YaHei", system-ui, sans-serif;
      }
      #boot .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1a5cb4, #274478);
        display: grid;
        place-items: center;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot .mark svg {
        width: 30px;
        height: 30px;
      }
      #boot .bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: currentColor;
        opacity: 0.14;
      }
      #boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #1a5cb4;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.82;
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark,
        #boot .bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
            <rect x="5" y="5" width="14" height="14" rx="2.5" />
            <rect x="9" y="9" width="6" height="6" rx="1" />
            <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" />
          </svg>
        </div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
